
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bookery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Bookery.</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Home</a>
                <a class="nav-link" href="../webpages/explore.html">Explore</a>
                <a class="nav-link" href="library.html">My Library</a>
                <a class="nav-link" href="../webpages/login.html">Login</a>
                <a class="nav-link" href="../webpages/register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="register-section">
        <div class="register-card">

            <h1>Sign in to your Account</h1>
            <p class="register-description">
                Continue your reading journey.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </div>
                
                <p id="registerMessage" role="status"></p>

                <button type="submit" class="register-button">
                    Sign in to your account
                </button>

            </form>

            <p class="login-link">
                Don't have an account?
                <a href="../webpages/register.html">Make an account here</a>
            </p>

        </div>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
