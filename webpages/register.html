
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bookery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Bookery.</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Home</a>
                <a class="nav-link" href="../webpages/explore.html">Explore</a>
                <a class="nav-link" href="library.html">My Library</a>
                <a class="nav-link" href="../webpages/login.html">Login</a>
                <a class="nav-link" href="../webpages/register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="register-section">
        <div class="register-card">

            <h1>Create an Account</h1>
            <p class="register-description">
                Join Bookery and start your reading journey.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required>
                </div>

                <p class="password-hint">
                    Password must have at least 8 characters,
                    including uppercase, lowercase and a number.
                </p>

                <p id="registerMessage" role="status"></p>

                <button type="submit" class="register-button">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>
    </main>

    <script src="../js/register.js"></script>
</body>
</html>
