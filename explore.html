<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Books - Bookery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bookery.</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="explore.html">Explore</a>
                <a class="nav-link" href="library.html">My Library</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <section class="container py-5">

        <div class="section-heading text-center">
            <p>YOUR NEXT STORY STARTS HERE</p>
            <h1>Explore Books</h1>
            <p>Find your next favorite book with Bookery.</p>
        </div>

        <form id="exploreSearchForm" class="search-box mb-5">
            <input
                type="text"
                id="exploreSearchInput"
                placeholder="Search books or authors..."
                aria-label="Search books"
                required>

            <button type="submit">Search</button>
        </form>

        
        <div id="exploreResults" class="book-grid">
            <p>Loading books...</p>
        </div>

    </section>

    <footer class="footer">
        <p class="copyright">
            © 2026 Bookery. All rights reserved.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/explore.js"></script>

</body>
</html>
